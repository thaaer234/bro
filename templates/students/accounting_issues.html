<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشكلات المحاسبة للطلاب</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <style>
        body { background: #f8f9fa; font-family: 'Cairo', sans-serif; }
        .card { border-radius: 0.75rem; }
        .issue-badge { font-size: 0.9rem; }
    </style>
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4 text-center">تقارير مشكلات المحاسبة للطلاب</h1>
    <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for item in accounting_issues %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ item.student.full_name }}</h5>
                    <ul class="list-group list-group-flush">
                        {% for issue in item.issues %}
                        <li class="list-group-item {% if '⚠️' in issue %}text-danger{% else %}text-success{% endif %}">{{ issue }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-muted">لم يتم العثور على أي طالب.</p>
        {% endfor %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
</body>
</html>
